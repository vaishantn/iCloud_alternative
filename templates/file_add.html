<!DOCTYPE html>
<html>
<head>
    <title>Select a File or Folder</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css"
    >
</head>

<body>
    <h2>Select a File or Folder</h2>

    {% if demo_mode %}
        <p>
            <strong>Public demo mode:</strong>
            Uploading is disabled to protect the safe demo files.
        </p>
    {% endif %}

    <form
        action="/upload/complete"
        method="POST"
        enctype="multipart/form-data"
    >
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <!-- Option 1: Single File Picker -->
        <div>
            <label><strong>Single File:</strong></label>
            <br>

            <input
                type="file"
                name="selected_file"
                {% if demo_mode %}disabled{% endif %}
            >
        </div>

        <br><br>

        <!-- Option 2: Folder Picker -->
        <div>
            <label><strong>Folder:</strong></label>
            <br>

            <input
                type="file"
                id="folderInput"
                name="selected_folder"
                webkitdirectory
                directory
                multiple
                style="display: none;"
                {% if demo_mode %}disabled{% endif %}
            >

            <button
                type="button"
                onclick="document.getElementById('folderInput').click();"
                {% if demo_mode %}disabled{% endif %}
            >
                Choose Folder
            </button>

            <span
                id="folderLabel"
                style="margin-left: 10px; font-weight: bold;"
            >
                No folder chosen
            </span>
        </div>

        <br><br>

        <button
            type="submit"
            {% if demo_mode %}disabled{% endif %}
        >
            {% if demo_mode %}
                Upload Disabled in Demo
            {% else %}
                Submit
            {% endif %}
        </button>

        <button
            type="button"
            onclick="location.reload();"
            {% if demo_mode %}disabled{% endif %}
        >
            Clear Selection
        </button>
    </form>

    <script>
        const folderInput = document.getElementById("folderInput");
        const folderLabel = document.getElementById("folderLabel");

        folderInput.onchange = function () {
            if (folderInput.files.length > 0) {
                const relativePath = folderInput.files[0].webkitRelativePath;
                const rootFolder = relativePath.split("/")[0];
                folderLabel.textContent = rootFolder + "/";
            } else {
                folderLabel.textContent = "No folder chosen";
            }
        };
    </script>
</body>
</html>
