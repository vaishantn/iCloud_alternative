<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
    <h2>Synced Files</h2>
    
    <table>
        <thead>
            <tr>
                <th>Folder</th>
                <th>File Name</th>
                <th>Size (Bytes)</th>
                <th>Last Modified</th>
            </tr>
        </thead>
        <tbody>
            {% for file in files %}
            <tr>
                <td><strong>{{ file.folder_name }}</strong></td>
                <td>{{ file.file_name }}</td>
                <td>{{ file.size }}</td>
                <td>{{ file.time }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <form action="/upload" method="GET">
        <button type="submit">Upload</button>
    </form>
    
    <form action="/add-device" method="GET">
        <button type="submit">Add Device</button>
    </form>
    
    <form action="/converter" method="GET">
        <button type="submit">Convert Files</button>
    </form>
</body>
</html>
